<!-- frontend/src/app/components/auth/auth.component.html -->
<div class="min-h-[80vh] flex items-center justify-center">
  <div class="w-full max-w-sm">

    <!-- Logo / wordmark -->
    <div class="mb-10 text-center">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600 mb-4">
        <!-- Film strip icon -->
        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3.375 19.5h17.25m-17.25 0a1.125 1.125 0 0 1-1.125-1.125M3.375 19.5h1.5C5.496 19.5 6 18.996 6 18.375m-3.75.125V4.875c0-.621.504-1.125 1.125-1.125h17.25c.621 0 1.125.504 1.125 1.125v13.5M6 18.375V5.625m0 0h12m-12 0v12.75m12-12.75v12.75M6 9h.008v.008H6V9Zm0 4.5h.008v.008H6v-.008Zm12-4.5h.008v.008H18V9Zm0 4.5h.008v.008H18v-.008Z" />
        </svg>
      </div>
      <h1 class="text-xl font-semibold text-white tracking-tight">ManualMage</h1>
      <p class="text-sm text-gray-500 mt-1">
        {{ mode() === 'signin' ? 'Sign in to your account' : 'Create your account' }}
      </p>
    </div>

    <!-- Card -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-xl">

      <!-- Google button -->
      <button
        (click)="onGoogle()"
        [disabled]="authService.isLoading()"
        class="w-full flex items-center justify-center gap-3 px-4 py-2.5 rounded-lg border border-gray-700 bg-gray-800 hover:bg-gray-750 hover:border-gray-600 transition-all text-sm font-medium text-gray-200 disabled:opacity-50 disabled:cursor-not-allowed mb-6">
        <!-- Google SVG -->
        <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>

      <!-- Divider -->
      <div class="relative mb-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-800"></div>
        </div>
        <div class="relative flex justify-center">
          <span class="bg-gray-900 px-3 text-xs text-gray-600">or continue with email</span>
        </div>
      </div>

      <!-- Email / password form -->
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1.5">Email</label>
          <input
            type="email"
            [value]="email()"
            (input)="onEmailChange($any($event.target).value)"
            placeholder="you@example.com"
            autocomplete="email"
            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors" />
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1.5">Password</label>
          <input
            type="password"
            [value]="password()"
            (input)="onPasswordChange($any($event.target).value)"
            placeholder="••••••••"
            autocomplete="current-password"
            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors" />
        </div>

        <!-- Error message -->
        @if (authService.authError()) {
          <div class="flex items-start gap-2 bg-red-950/50 border border-red-900/60 rounded-lg px-3 py-2.5">
            <svg class="w-4 h-4 text-red-400 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
            </svg>
            <p class="text-xs text-red-400">{{ authService.authError() }}</p>
          </div>
        }

        <!-- Submit button -->
        <button
          (click)="onSubmit()"
          [disabled]="authService.isLoading() || !email() || !password()"
          class="w-full bg-indigo-600 hover:bg-indigo-500 disabled:bg-indigo-900 disabled:text-indigo-700 disabled:cursor-not-allowed text-white text-sm font-medium py-2.5 rounded-lg transition-all flex items-center justify-center gap-2">
          @if (authService.isLoading()) {
            <div class="w-4 h-4 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin"></div>
          }
          {{ mode() === 'signin' ? 'Sign in' : 'Create account' }}
        </button>
      </div>
    </div>

    <!-- Toggle sign in / register -->
    <p class="text-center text-sm text-gray-600 mt-6">
      {{ mode() === 'signin' ? "Don't have an account?" : 'Already have an account?' }}
      <button
        (click)="toggleMode()"
        class="text-indigo-400 hover:text-indigo-300 font-medium ml-1 transition-colors">
        {{ mode() === 'signin' ? 'Create one' : 'Sign in' }}
      </button>
    </p>

  </div>
</div>
